# PASTIS-1's S2 at its native 128 px (8 x 8 tokens of 160 m, <task>/tok/S2L2A_tok128/) on the gapped 14-wide raster,
# with the frozen short tokenizer's 16 x 16 map nested 2 x 2 under it (eo/data/seg_dataset.py, NATIVE S2): every map
# code 198 (j + 1) positions after the S2 code of its cell, EO_MAP at 989; 324 tokens. Step 4.1's recipe
