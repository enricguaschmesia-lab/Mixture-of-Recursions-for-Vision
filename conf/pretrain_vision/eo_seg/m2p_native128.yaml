# on the command line. Differs from r0_s41_lora16 in exactly seg.arm, seg.s2_crop, seg.map_order and max_length.
defaults:
  - r0_s41_lora16
  - _self_

seg:
  arm: short
  s2_crop: 128
  map_order: nested
max_length: 324
