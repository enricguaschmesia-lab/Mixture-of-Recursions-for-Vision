# @package _global_
#
# ARM A10cR-w384-tr-NC — B3's width check (Paper B plan, B3, "Width is not scanned"): the RANDOM router on
# A10cR's 1 + 9 + 1 block at width 384, TRAIN split, WITHOUT Coords, seed 42.
#
# The 1 + 3 + 1 block on train reads an equal-compute span 2.5-3x A10cR-tr's (0.013-0.018 against
# 0.0052-0.0055 nats), but it changed two things at once: parameters (17.70 M non-embedding against
# 38.94 M) and layers per pass (3 against 9). This run keeps the large block's layers per pass and takes the
# small block's parameters: 11 unique layers at width 384 hold 17.31 M non-embedding, 2.2% under the
# 1 + 3 + 1 block (B10c-11L was matched to A10c at -1.7%). If its span reads like the 1 + 3 + 1 cell's,
# parameters made depth matter; if like A10cR-tr's, layers per pass did. The embedding table shrinks with
# the width too (87,556 x 384), as the plan notes.
#
# Vocabulary v1 with Coords dropped from the data, like the Coords-free cell's four runs, so the comparison
# is like with like: Enric, 2026-11-15, an exception to the 2026-11-14 rule (no model holds Coords tokens),
# as worklog §5 item 65 was.
#
# ┌── THE DIFF FROM A10cR-w384-tr (arm_a10crw384tr_random), IN FULL ────────────┐
# │                                  A10cR-w384-tr     A10cR-w384-tr-NC (this)   │
# │   multimodal.active_modalities   6 image + Coords  the 6 image only          │
# │ ...and from A10cR-b3-tr-NC (arm_a10crb3trnc_random): the layer count and the │
# │ four width keys. Nothing else. W29 in eo/scripts/verify_phase3.py asserts    │
# │ both, the geometry, and that the key reaches the data.                       │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# Score it through its Coords twin with the Coords block removed, as the cell's runs were:
#   measure_run.sh --drop-modalities Coords a10crw384trnc <run> eo_terramesh/arm_a10crw384tr_random
#
#   launch (RCP, course project: the train tokens are on g49 only):
#     jobs/train.sh mor10crw384trnc eo_terramesh/arm_a10crw384trnc_random mor10crw384trnc_<ts>
#     with -e TERRAMESH_TRAIN_TOK_ROOT=$G/tm_train/root

defaults:
  - arm_a10crw384tr_random
  - _self_

multimodal:
  active_modalities: ['S2L2A', 'S1GRD', 'S1RTC', 'DEM', 'NDVI', 'LULC']
