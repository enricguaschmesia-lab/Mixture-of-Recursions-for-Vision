# @package _global_
#
# TerraMesh EO pretraining — MoR, token-choice routing.
#
# The EO counterpart of conf/pretrain_vision/multimodal_training/
# 110526_multimodal_training_final.yaml. Model, router and optimizer settings are
# deliberately kept IDENTICAL to that config wherever the data does not force a
# change, because Phases 3–4 compare EO routing against the CLEVR results and every
# gratuitous difference is one more thing that would have to be controlled for.
# Every field that does differ says why below.
#
# Phase 2 delivers this config and proves the loop runs (D2.7 smoke run).
# It does NOT set the training budget — num_train_steps and the batch schedule
# belong to the pretraining milestone (worklog §1), not to this phase.
#
#   smoke run:   python pretrain.py --config-path conf/pretrain_vision/eo_terramesh \
#                    --config-name terramesh_mor_token stop_steps=30 wandb=false

# === Run identity ===
name: terramesh_mor_token
wandb: true
wandb_mode: online
wandb_entity: ${oc.env:WANDB_ENTITY}
wandb_project: ${oc.env:WANDB_PROJECT,mixture-of-recursions-vision}
wandb_run_name: terramesh_mor_token
wandb_run_id: null
output_dir: null
tensorboard: false
tensorboard_dir: null

# === Resume ===
resume_from_checkpoint: false
resume_step: null

# === Dataset ===
# Rooted at $TERRAMESH_TOK_ROOT (default /data/enric/data/TerraMesh/val). The
# crop lives in the directory name (<MOD>_tok224), derived from
# contract.TOK_DIR_SUFFIX, so this config cannot silently read the 256 set.
dataset: terramesh_multimodal
multimodal:
  # Only the val split is tokenized; train is ~14 TB and not needed yet
  # (Meeting 2, worklog §5). 'split' is carried for symmetry — the arrays sit
  # directly under root_dir.
  split: val
  # The ratified training set (Meeting 2): all six tokenized image modalities
  # plus Coords. The presence masks pick exactly one of S1GRD/S1RTC per row, so
  # a sequence carries 5 image modalities + Coords. Listed explicitly rather
  # than relying on eo_vocab.DEFAULT_ACTIVE_MODALITIES so the run's modality set
  # is visible in the config that produced the checkpoint.
  active_modalities: ['S2L2A', 'S1GRD', 'S1RTC', 'DEM', 'NDVI', 'LULC', 'Coords']
  # Randomized per sample, Coords included — so the model learns to predict any
  # modality from any other rather than from a fixed layout. Coords is in the
  # shuffle, not pinned: pinning would confound Phase 5, which is precisely
  # about whether Coords routes differently.
  modality_order: random
  shuffle_image_patches: false
  # NOTE: sample_from_k_augmentations / text_tokenizer_path / text_max_length are
  # CLEVR-only. The EO dataset has no augmentation dimension and no text branch,
  # and load_dataset.py's EO branch does not pass them. Do not add them here.
  #
  # === The held-out evaluation split (Phase 3 D3.1) ===
  # Names the COMMITTED artifact eo/data/eval_rows_v1.json. Train is its
  # complement, computed at load. Null here means no split and no evaluation —
  # the Phase 2 behaviour.
  #
  # ⚠ ONE-WAY DOOR. Every number from a run is conditioned on this split;
  # changing the tag invalidates the comparison against anything trained on the
  # old one. The artifact carries hashes of tok_index.parquet and
  # val_metadata.parquet and refuses to load against different ones.
  #
  # The group key is GEOGRAPHIC, not the plan's per-corpus sample_id parse:
  # measured 2026-09-22, 90.7% of ssl4eos12 tiles physically overlap a majortom
  # tile (closest pair 20 m), so a per-corpus key holds out a location and
  # leaves the same ground in training. Single-linkage clustering of tile
  # centroids at 5 km, across both corpora, gives 5,103 groups; 5% of groups
  # per stratum = 4,416 rows (majortom 4,032 / ssl4eos12 384). Reasoning and
  # the measurements: eo/data/eval_split.py.
  eval_split: v1
weights: null

# === Batching ===
# ⚠ SUPERSEDED 2026-09-22 by Phase 3 Step 2. The fp32 numbers below are Phase
#   2's (D2.7, 2026-09-20) and the run is no longer fp32 — see the precision
#   block for the fp16 sweep that sets the shipped value. Kept because the
#   per-unit-batch cost and the reason for it still explain the shape of the
#   fp16 numbers:
#     fp32  B=2   6,883 MiB peak   4.36 samples/s
#     fp32  B=3   9,739 MiB peak   5.26 samples/s
#     fp32  B=4   OUT OF MEMORY (died in backward after 11 steps)
#   ~2,856 MiB per unit of batch, dominated by the (B, L, V) logits: at B=4 that
#   tensor alone is 1.47 GiB and needs a second copy in backward.
#   Phase 2 shipped B=2 over B=3 on headroom grounds; under fp16 that trade
#   changes and the shipped value is now 4. Reasoning at per_device_train_batch_size.
#
# ⚠ total_batch_size is NOMINAL. preprocess_config computes
#   gradient_accumulation_steps = round(total_batch_size / per_device), so a
#   total that does not divide by per_device silently trains at a different
#   actual batch size -- 256 with per_device 3 gives 85 x 3 = 255. It prints the
#   actual, but nothing fails. Keep total_batch_size divisible by per_device.
#   (256 and the Step 3 lean of 64 both divide by 4.)
total_batch_size: 256
# 4 under fp16, measured 13.92 samples/s at 10,110 MiB peak (84% of the card).
# ⚠ This is more aggressive on headroom than Phase 2's fp32 choice, which took
#   B=2 over B=3 to stay under ~80%. Reversed deliberately: the prize is larger
#   here (1.37x for B=4 over B=2, against 1.06x there),
#   PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True is set unconditionally in
#   pretrain.py, and eval adds its own peak on top during a run. Watch the first
#   hours of arm A; fall back to 3 (7,887 MiB) or 2 (5,664 MiB) if it fragments.
per_device_train_batch_size: 4
gradient_accumulation_steps: null   # auto-computed by preprocess_config
batch_size_rampup_steps: null

# === Sequence length ===
# Measured on all 89,088 rows (Phase 2 Step 4): every sequence is exactly
#   5 x (196 + BO + EO)  +  (3 + BO + EO)  =  995
# tokens — 5 present image modalities at the 224 crop (14x14 = 196) plus Coords.
# One distinct length across the whole split, so padding is zero and batch
# shapes are constant. 1048 is inherited from the CLEVR configs and kept
# unchanged: 995 fits it, and matching CLEVR removes one difference from the
# Phase 3/4 comparison. The 53 tokens of slack are pure padding on every row.
max_length: 1048

add_bos_token: false
global_shuffling: false
local_shuffling: false

tokenizer: smollm

model: smollm
model_name_or_path: HuggingFaceTB/SmolLM-135M
model_config:
  # 30 -> 29 so (num_hidden_layers - 2) is divisible by num_recursion=3.
  num_hidden_layers: 29
  # 5x15,360 + 4,375 (LULC) + 6,366 (Coords) + 14 BO/EO + 1 PAD = 87,556.
  # ⚠ Do NOT hand-edit. This is asserted at startup against
  # eo_vocab.TOTAL_VOCAB_SIZE (lm_dataset/modality_registry.assert_vocab_size);
  # a mismatch is rejected before the model is built. Too small indexes past the
  # embedding table; too large carries dead rows AND makes the ln(V) loss
  # baseline wrong, which is exactly what the smoke run checks against.
  vocab_size: 87556
# flash_attention_2 needs Ampere (sm_80+). Both cards here are older —
# TITAN V is sm_70, GTX TITAN X is sm_52 — so sdpa it is.
attn_implementation: sdpa
use_pretrained_weights: false

recursive:
  enable: true
  base_depth: null
  num_recursion: 3
  sharing: middle_cycle
  ln_share: true
  initialization: random

kv_sharing:
  enable: false
  base_depth: null
  num_recursion: null
  sharing: null

mor:
  enable: true
  type: token
  capacity: null
  rand_router: false
  router_type: mlp
  z_loss: true
  z_coeff: 0.001
  temp: 1.0

  expert:
    cap_warmup_step: 0
    router_func: sigmoid
    alpha: 0.1
    sampling: aux_loss
    include_first: true
    coeff: 0.001
    gating: weighted

  token:
    router_func: softmax
    # ⚠ alpha MUST be 1.0. alpha in {0.1, 0.5} caused router collapse.
    alpha: 1.0
    balancing: loss
    coeff: 0.1
    u: 0.001
    gating: weighted
    # First N steps force every token to max depth, which hides the router
    # entirely. Keep at 0 for short runs.
    bal_warmup_step: 0

lr_scheduler_type: warmup_stable_decay
lr_scheduler_kwargs:
  num_decay_steps: 2000
  decay_type: linear
learning_rate: 0.003
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.1
# ⚠ fp32, and the reasoning matters because both obvious alternatives are worse
# here. Measured on the TITAN V (sm_70), 4096^3 matmul:
#     fp32  12.5 TFLOP/s    fp16  90.1 TFLOP/s    bf16  9.7 TFLOP/s
#
#   bf16 (what the CLEVR reference config uses) is the WORST option on this
#   card. Volta has fp16 tensor cores but no native bf16, so bf16 is emulated
#   and lands slower even than fp32. torch.cuda.is_bf16_supported() returns True
#   regardless -- it reports emulation, not tensor-core support -- so this cannot
#   be probed at runtime and has to be chosen deliberately.
#
#   fp16 is the fastest and, as of Phase 3 Step 2 (2026-09-22), IT NOW WORKS.
#   It previously did not: `precision` set the model's torch_dtype AND
#   TrainingArguments(fp16=True), so the PARAMETERS went fp16 while the
#   GradScaler that fp16=True enables requires fp32 master weights -- training
#   died at the first optimizer step with "Attempting to unscale FP16
#   gradients." bf16 escaped this only because bf16 needs no GradScaler.
#
#   TWO bugs had to be fixed, and the second was invisible until the first was:
#     1. parameter dtype decoupled from autocast dtype -- see mixed_precision
#        below and util.misc.get_param_dtype.
#     2. MoRTrainer clips gradients in TWO groups (router vs the rest) and
#        called accelerator.clip_grad_norm_ twice, which unscales twice ->
#        "unscale_() has already been called on this optimizer". No scaler, no
#        symptom, so fp32 and bf16 never saw it.
#
# MEASURED end-to-end on the TITAN V, 14 steps, grad_accum=1, this model and
# sequence length -- NOT the 4096^3 matmul figures above:
#
#     precision  B    samples/s   peak MiB   GPU util
#     fp32       2      6.25        6,418      93%
#     fp32       3      6.63        9,197      97%
#     fp32       4      OOM
#     fp16       2     10.13        5,664      81%
#     fp16       3     12.18        7,887      87%
#     fp16       4     13.92       10,110      92%     <- shipped
#     fp16       6      OOM
#
# ⚠ The speedup is 2.2x, NOT the 7x the matmul benchmark suggests. That ratio
#   is peak tensor-core throughput on a large square matmul; real training here
#   is small-batch and spends much of its time in bandwidth-bound work --
#   layernorm, softmax, and the (B, L, 87556) logits and cross-entropy -- which
#   gains little or nothing from tensor cores. Do not quote 7x anywhere.
#
# ⚠ GPU utilization is 81-97%, so the DATALOADER IS NOT THE BOTTLENECK at these
#   rates (plan Step 2.4 predicted it might become one). Untested above ~14
#   samples/s; re-check if anything makes the model faster.
#
# fp16 also raises the batch ceiling from 3 to 4, as 2.3 predicted. Peak memory
# does NOT halve (5,664 vs 6,418 MiB at B=2, only -12%) because the master
# weights, gradients and Adam moments all stay fp32; only activations shrink.
precision: fp16
# ⚠ Keeps PARAMETERS in fp32 while `precision` above selects the AUTOCAST dtype.
# This is what fp16 training actually means, and without it the GradScaler
# cannot work. Opt-in on purpose: absent this key the old behaviour is exact, so
# every CLEVR config -- all `precision: bf16`, none setting this -- keeps
# pure-bf16 parameters and is bit-for-bit unaffected. Phases 3-4 compare EO
# routing against those CLEVR results, so silently switching the reference path
# to mixed precision would confound the comparison. See util.misc.get_param_dtype.
mixed_precision: true
max_grad_norm: 1.0
# ⚠ PLACEHOLDER — the training budget belongs to the pretraining milestone
# (worklog §1), not to Phase 2. Derivation for whoever sets it:
#   89,088 samples / 256 total_batch_size = 348 steps/epoch.
# The value below is 348 x 100 epochs, matching the CLEVR reference's 100
# epochs, and is a placeholder for arithmetic only — it has not been chosen on
# any convergence grounds. The D2.7 smoke run overrides it with stop_steps=30.
num_train_steps: 34800
stop_steps: 34800
num_warmup_steps: 1740   # 5% of training
save_interval: null
save_steps: 5000
# === Evaluation cadence (D3.2) ===
# Teacher-forced eval loss on the 4,416 held-out rows, logged per modality on
# the same axis as the training loss. A full pass is ~2,208 forward batches at
# eval batch 2, so this is not free — the cadence is a deliberate trade against
# training throughput and belongs to the Step 3 budget decision, like
# num_train_steps. 2000 is a placeholder consistent with save_steps.
eval_steps: 2000
# 4: measured 34.28 samples/s under fp16, a full 4,416-row pass in 2.1 min
# (against 20.0 samples/s / 3.7 min at fp32 B=2). Eval throughput saturates by
# B=4-8, so larger buys nothing: B=8 is 36.62 samples/s for 73% more memory.
# ⚠ The 4,502 MiB measured for eval is standalone. During training the
#   optimizer state and gradients are still resident, so the true coexisting
#   peak is higher -- another reason not to push this to 8.
per_device_eval_batch_size: 4
# Eval before step 1. The untrained eval loss must land at ln(87,556) = 11.3800
# — the cheapest possible check that the split, the vocabulary and the eval
# loop all agree (plan Step 1.6c). Cheap insurance, once per run.
eval_on_start: true
fixed_save_steps: null
save_total_limit: null
logging_steps: 10
# ⚠ Modality ORDER depends on this value: _get_rng seeds on
# (seed, worker_id, idx), so a run is bit-reproducible only at a FIXED worker
# count. Token CONTENT is unaffected. Do not change it mid-experiment.
# The box has 4 cores / 4 threads, so 16 (the CLEVR value) would oversubscribe.
dataloader_num_workers: 4
gradient_checkpointing: false
# ⚠ null, and NOT "only applied if you launch with deepspeed" -- that is wrong.
# util/misc.get_launcher_type() returns "deepspeed" for ANYTHING that is not an
# accelerate launch, plain `python pretrain.py` included, so a non-null value
# here is honoured on every run. deepspeed is not installed in this .venv, so a
# non-null value fails at TrainingArguments construction with a
# PackageNotFoundError that does not mention the config at all.
#
# null is also the right value on merit: the two GPUs are heterogeneous (sm_70
# and sm_52, and only the TITAN V has fp16 tensor cores), so this runs
# single-GPU on cuda:0 rather than sharding across them.
deepspeed: null

# === Vision eval ===
# ⚠ MUST stay false on the EO path. MultimodalVisionEvalCallback is CLEVR-shaped
# in three places (CLEVR dataset class and registry, and a square-grid reshape
# that cannot work for Coords' 3 tokens) and refuses to construct on an EO run —
# see util/callback.py. patch_grid_size is inert while this is false; it records
# the correct EO value (224/16 = 14, not CLEVR's 16) for whenever an EO-aware
# version is written, which is Phase 5 work.
vision_eval:
  enable: false
  eval_epoch_interval: 2
  num_val_samples: 2
  patch_grid_size: 14
  cosmos_model_path: null
