# @package _global_
#
# ARM A10c-b3-tr-NC — the LEARNED router on the 1 + 3 + 1 block, TRAIN split, WITHOUT Coords, seed 42.
# B3's follow-up in the first measurable cell (Paper B, B3), Coords-free by Enric's answer to worklog
# §4 item 59 (2026-11-12, "Drop Coords"): A0.1's verdict (2026-11-12, 00:04) removes Coords from models
# started after it, and these follow-ups had not started.
#
# ┌── THE DIFF FROM A10c-b3-tr (arm_a10cb3tr_mor), IN FULL ────────────────────┐
# │                                  A10c-b3-tr        A10c-b3-tr-NC (this)     │
# │   multimodal.active_modalities   6 image + Coords  the 6 image only         │
# │ ...and from A10cR-b3-tr-NC (arm_a10crb3trnc_random): mor.rand_router only.  │
# │ Nothing else. W29 in eo/scripts/verify_phase3.py asserts both, and that the │
# │ key reaches the data: 990-token sequences, no Coords id.                    │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# As A10c-NC against A10c: a sequence is 5 x (196 + BO + EO) = 990 tokens instead of 995, max_length
# stays 1048, and Coords' vocabulary rows stay in the table and never occur. Score it on the cell's
# held-out sequences with the Coords block removed (eval_checkpoint.py --arm-config
# eo_terramesh/arm_a10crb3_random --drop-modalities Coords), which keeps every row's image order.
# Runs on code_w1b, which logs the per-update depth shares (depth_shares.jsonl).
#
#   launch (RCP, course project: the train tokens are on g49 only):
#     jobs/train.sh mor10cb3trnc eo_terramesh/arm_a10cb3trnc_mor mor10cb3trnc_<ts>
#     with -e TERRAMESH_TRAIN_TOK_ROOT=$G/tm_train/root

defaults:
  - arm_a10cb3tr_mor
  - _self_

multimodal:
  active_modalities: ['S2L2A', 'S1GRD', 'S1RTC', 'DEM', 'NDVI', 'LULC']
