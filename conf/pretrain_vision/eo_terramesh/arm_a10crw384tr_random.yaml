# @package _global_
#
# A10cR-w384-tr — A SCORING CONFIG, NEVER TRAINED (2026-11-15). The Coords twin of A10cR-w384-tr-NC
# (arm_a10crw384trnc_random): it builds that run's model and gives the held-out sequences WITH Coords,
# which eval_checkpoint.py --drop-modalities Coords then removes, so every row keeps its image order and
# pairs token for token with the Coords-free 1 + 3 + 1 train cell, scored the same way through
# arm_a10crb3_random (wave 1 plan, Step 4). Since 2026-11-12 no model trains on Coords (worklog §5), and
# preflight's check 23 refuses a new run on it: do not launch this arm.
#
# ┌── THE DIFF FROM A10cR-tr (arm_a10crtr_random), IN FULL ────────────────────┐
# │                                     A10cR-tr       A10cR-w384-tr (this)     │
# │   model_config.hidden_size          576            384                      │
# │   model_config.intermediate_size    1536           1024                     │
# │   model_config.num_attention_heads  9              6                        │
# │   model_config.num_key_value_heads  3              2                        │
# │ Nothing else: SmolLM-135M's ratios at width 384 (head dimension 64, three   │
# │ query heads per KV head, MLP 8/3 of the width). W29 in                      │
# │ eo/scripts/verify_phase3.py asserts it, with the geometry.                  │
# └─────────────────────────────────────────────────────────────────────────────┘

defaults:
  - arm_a10crtr_random
  - _self_

model_config:
  hidden_size: 384
  intermediate_size: 1024
  num_attention_heads: 6
  num_key_value_heads: 2
