# @package _global_
#
# ARM A10cR-b3-tr-NC — the RANDOM router on the 1 + 3 + 1 block, TRAIN split, WITHOUT Coords, seed 42.
# Worklog §4 item 59 (2026-11-12): with the learned follow-ups Coords-free, the cell's random-router
# seeds are rerun without Coords so that every comparison in the cell is like with like, and measured
# again (B0 Step 6's measurement, then B3's rule with the cell's own seed gap).
#
# ┌── THE DIFF FROM A10cR-b3-tr (arm_a10crb3tr_random), IN FULL ───────────────┐
# │                                  A10cR-b3-tr       A10cR-b3-tr-NC (this)    │
# │   multimodal.active_modalities   6 image + Coords  the 6 image only         │
# │ ...and from A10c-b3-tr-NC (arm_a10cb3trnc_mor): mor.rand_router only.       │
# │ Nothing else. W29 in eo/scripts/verify_phase3.py asserts both.              │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Score it with arm_a10crb3_random and --drop-modalities Coords (see arm_a10cb3trnc_mor.yaml).
#
#   launch (RCP, course project):
#     jobs/train.sh mor10crb3trnc eo_terramesh/arm_a10crb3trnc_random mor10crb3trnc_<ts>
#     with -e TERRAMESH_TRAIN_TOK_ROOT=$G/tm_train/root

defaults:
  - arm_a10crb3tr_random
  - _self_

multimodal:
  active_modalities: ['S2L2A', 'S1GRD', 'S1RTC', 'DEM', 'NDVI', 'LULC']
