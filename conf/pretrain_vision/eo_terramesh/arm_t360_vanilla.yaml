# @package _global_
#
# ARM T360 — a larger vanilla on the full TerraMesh TRAIN split (2026-10-25).
#
# B10c's recipe at the SmolLM-360M shape (MoR paper Table 6: 32 x 960, 15 heads, 5 KV,
# ff 2560; 398.69 M parameters with the EO vocabulary, 314.64 M non-embedding) on the
# 8,929,841 train scenes instead of val's 84,672 rows, for 2 epochs on 2 A100s (DDP).
#
# ┌── THE DIFF FROM B10c (arm_b10c_vanilla), IN FULL ─────────────────────────┐
# │                               B10c          T360 (this)                   │
# │   model_config                576/29/9/3/1536  960/32/15/5/2560           │
# │   multimodal.split            val           train                         │
# │   total_batch_size            256           1024                          │
# │   per_device_train_batch_size 4             16  (x 2 GPUs x 32 accum)     │
# │   per_device_eval_batch_size  4             16  (4,416 = 16 x 2 x 138)    │
# │   num_train_steps, stop_steps 3300          17441 (2 epochs)              │
# │   num_warmup_steps            165           872   (5%, as before)         │
# │   num_decay_steps             330           1744  (10%, as before)        │
# │   save_steps, eval_steps      330, 165      250, 250 (~1.5 h)             │
# │ Nothing else. W16 in eo/scripts/verify_phase3.py asserts it.              │
# └───────────────────────────────────────────────────────────────────────────┘
#
# WHY batch 1024 (the one change to the recipe): SmolLM trained this exact shape at the
# same LR 3e-3 with 1.05 M-token (SmolLM) and 1.57 M-token (SmolLM2) batches; 256 x 995
# = 0.25 M was the most aggressive of every reference at this size. Same tokens and wall
# clock: the per-device batch is the benchmarked 16 (5.47 s per 256 on 2 A100s).
#
# DATA: the train root comes from TERRAMESH_TRAIN_TOK_ROOT (eo/scripts/tokenize_train.py
# consolidate) and is refused unless its build.json says split train, offset-free and not
# partial. Evaluation stays on val's 4,416 held-out rows (eval_split v1) of val_clean, which
# equals TerraMesh's fixed upstream version, as the train split does (token_set: clean).
#
#   launch (RCP, a -g 2 pod): jobs/train_mgpu.sh t360 eo_terramesh/arm_t360_vanilla vanilla360t_<ts>

defaults:
  - arm_b10c_vanilla
  - _self_

model_config:
  hidden_size: 960
  intermediate_size: 2560
  num_hidden_layers: 32
  num_attention_heads: 15
  num_key_value_heads: 5

multimodal:
  split: train

total_batch_size: 1024
per_device_train_batch_size: 16
per_device_eval_batch_size: 16

# 2 x 8,929,841 / 1024 = 17,441.1 steps -> 17,441 = 1.99999 epochs.
num_train_steps: 17441
stop_steps: 17441
num_warmup_steps: 872
lr_scheduler_kwargs:
  num_decay_steps: 1744
save_steps: 250
eval_steps: 250
