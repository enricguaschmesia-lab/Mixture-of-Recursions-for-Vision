# @package _global_
#
# ARM B10cL, STAGE 1 — the embedding warm-up under the FROZEN SmolLM-135M body.  LLM init,
# 2026-10-28 (docs/notes/smollm_init_2026-10-28.md).
#
# ┌── THE DIFF FROM B10cV STAGE 1 (arm_b10cv_stage1), IN FULL ──────────┐
# │   pretrain_init.conversion    .../smollm_init/b10c_v1/smollm_body   │
# │   pretrain_init.variant       smollm                                │
# │ Nothing else (K = 330 at a constant LR after a 16-step warmup), and │
# │ from B10cL it differs exactly as B10cV's stage 1 differs from B10cV.│
# │ W22 in eo/scripts/verify_phase3.py asserts it.                      │
# └─────────────────────────────────────────────────────────────────────┘
#
#   launch (RCP):  jobs/train.sh b10cl_s1 eo_terramesh/arm_b10cl_stage1 vanilla10cl_s1_<ts>

defaults:
  - arm_b10cv_stage1
  - _self_

pretrain_init:
  conversion: ${oc.env:MOR_EO_RCP,/data/enric}/weights/smollm_init/b10c_v1/smollm_body
  variant: smollm
