# === Run identity ===
name: smoke_50steps_token
wandb: true
wandb_mode: online
wandb_entity: ${oc.env:WANDB_ENTITY}
wandb_project: ${oc.env:WANDB_PROJECT,mixture-of-recursions-vision}
wandb_run_name: smoke_50steps_token
wandb_run_id: null      # auto-generated at runtime if null
output_dir: null
tensorboard: false
tensorboard_dir: null

# === Resume ===
resume_from_checkpoint: false
resume_step: null

# === Dataset (vision PoC) ===
dataset: clevr_multimodal
multimodal:
  split: train
  active_modalities: ['tok_rgb@256']
  modality_order: fixed
  sample_from_k_augmentations: 10

weights: null

# === Batching ===
total_batch_size: 256
per_device_train_batch_size: 16
gradient_accumulation_steps: null   # Auto-computed by preprocess_config
batch_size_rampup_steps: null

# === Sequence length ===
# <BO_rgb> + 256 Cosmos tokens + <EO_rgb> = 258. No text modality → no padding.
max_length: 258

add_bos_token: false
global_shuffling: false
local_shuffling: false

tokenizer: smollm

model: smollm
model_name_or_path: HuggingFaceTB/SmolLM-135M
model_config:
  # Override from 30 → 29 so (num_hidden_layers - 2) is divisible by num_recursion=3.
  num_hidden_layers: 29
  # 3 × 64000 (image) + 50260 (text) + 10 (BO/EO) + 1 (PAD) = 242271
  vocab_size: 242271
attn_implementation: sdpa
use_pretrained_weights: false

recursive:
  enable: true
  base_depth: null
  num_recursion: 3
  sharing: middle_cycle
  ln_share: true
  initialization: random

kv_sharing:
  enable: false
  base_depth: null
  num_recursion: null
  sharing: null

mor:
  enable: true
  type: token
  capacity: null        # unused under token-choice
  rand_router: false
  # Paper's Table 4 (right): MLP router is best for token-choice.
  router_type: mlp
  # Paper enables z-loss by default for token-choice; penalizes large router
  # logits to fight saturation that precedes collapse.
  z_loss: true
  z_coeff: 0.001
  temp: 1.0

  # Expert settings kept for A/B with `type: expert`; inert under token-choice.
  expert:
    cap_warmup_step: 0
    router_func: sigmoid
    alpha: 0.1
    sampling: aux_loss
    include_first: true
    coeff: 0.001
    gating: weighted

  token:
    # Paper's selected config: softmax + MLP + balancing-loss (coeff 0.1) + z-loss.
    router_func: softmax          # was: sigmoid — softmax normalizes over the Nr experts
    alpha: 0.1
    balancing: loss               # 'loss' = explicit balancing-loss; 'loss_free' = router-bias trick
    coeff: 0.1                    # was: 0.001 — main anti-collapse lever (paper uses 0.1)
    u: 0.001                      # router-bias update rate; only used when balancing=='loss_free'
    gating: weighted
    # First N steps force every token to max depth (Nr-1). For short smoke runs,
    # this hides the router entirely, so keep it at 0.
    bal_warmup_step: 0

lr_scheduler_type: warmup_stable_decay
lr_scheduler_kwargs:
  num_decay_steps: 4000   # 20% of training
  decay_type: linear
learning_rate: 0.003
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.1
precision: bf16
max_grad_norm: 1.0
# steps_per_epoch = Dataset_size (our case 50k) / 256 = 195.3 → round to 195
# Number of training steps = steps_per_epoch x num_epochs = 195 x 100 = 19500
num_train_steps: 19500
stop_steps: 19500
# 5% of 19500 = 975 steps -> warmup to 0.003 in first epoch, then decay for remaining 19 epochs.
num_warmup_steps: 975   # 5% of training
save_interval: null     
save_steps: 5000  # Save every 5000 steps (≈ every 25 epochs) for this short smoke run; set to null to disable interval saving and rely solely on save_total_limit.
fixed_save_steps: null
save_total_limit: null
logging_steps: 10
dataloader_num_workers: 16
gradient_checkpointing: false
deepspeed: ds_configs/stage2.config

# === Vision eval: per-patch recursion heatmap ===
# Runs every eval_epoch_interval epochs. Decodes 2 val images with Cosmos if
# cosmos_model_path is set, otherwise shows a normalised token-ID grid.
# To enable Cosmos: pip install cosmos-tokenizer and point cosmos_model_path to
# a CausalVideoTokenizer checkpoint (e.g. "nvidia/Cosmos-Tokenizer-DI8x8").
vision_eval:
  enable: true
  eval_epoch_interval: 5   
  num_val_samples: 2
  patch_grid_size: 16          # 16×16 = 256 tokens for tok_rgb@256
  cosmos_model_path: /home/gianfranco/projects/2025/Visual_Intelligence_Project/Mixture-of-Recursions-for-Vision/pretrained_ckpts/Cosmos-0.1-Tokenizer-DI16x16      # set to enable Cosmos RGB decode
