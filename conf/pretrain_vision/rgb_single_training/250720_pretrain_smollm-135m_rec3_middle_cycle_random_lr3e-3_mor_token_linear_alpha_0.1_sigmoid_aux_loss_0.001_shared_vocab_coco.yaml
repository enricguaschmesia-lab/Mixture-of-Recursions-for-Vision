# @package _global_

# === Run identity ===
name: smoke_19500_coco_rgb
wandb: true
wandb_mode: online
wandb_entity: ${oc.env:WANDB_ENTITY}
wandb_project: ${oc.env:WANDB_PROJECT,mixture-of-recursions-vision}
wandb_run_name: smoke_19500_coco_rgb
wandb_run_id: null  
output_dir: null
tensorboard: false
tensorboard_dir: null

# === Resume ===
resume_from_checkpoint: false
resume_step: null



# === Reproducibility ===
# Single seed flows everywhere: torch/numpy/random global state, HF Trainer
# sampler, dataset per-sample RNG, sharing_strategy random source-layer pick,
# DataLoader worker re-seeding. Change this to get a different "random" run.
seed: 42
# Set true ONLY when you need bitwise-identical runs across launches (e.g.
# debugging non-determinism). Costs throughput and disables some CUDA kernels.
deterministic_cuda: false


# === Dataset (COCO RGB) ===
# COCO is single-augmentation: each .npy file has shape (1, 256). The dataset
# class indexes arr[aug_idx], so sample_from_k_augmentations MUST be 1 here,
# otherwise __getitem__ will IndexError.
dataset: coco_multimodal
multimodal:
  split: train
  active_modalities: ['tok_rgb@256']
  modality_order: fixed
  sample_from_k_augmentations: 1

weights: null

# === Batching ===
# Same effective batch size as the CLEVR PoC (256). 50k train images → ~195 steps/epoch.
total_batch_size: 256
per_device_train_batch_size: 32
gradient_accumulation_steps: null   # Auto-computed by preprocess_config
batch_size_rampup_steps: null

# === Sequence length ===
# <BO_rgb> + 256 Cosmos tokens + <EO_rgb> = 258. No text modality → no padding.
max_length: 258

add_bos_token: false
global_shuffling: false
local_shuffling: false

tokenizer: smollm

model: smollm
model_name_or_path: HuggingFaceTB/SmolLM-135M
model_config:
  # Override from 30 → 29 so (num_hidden_layers - 2) is divisible by num_recursion=3.
  num_hidden_layers: 29
  # Unified multimodal vocab (shared text codebook layout):
  # 3 × 64000 (image) + 50260 (text) + 10 (BO/EO) + 1 (PAD) = 242271
  vocab_size: 242271
attn_implementation: sdpa
use_pretrained_weights: false

# === MoR recursion config ===
recursive:
  enable: true
  base_depth: null
  num_recursion: 3
  sharing: middle_cycle
  ln_share: true
  initialization: random

kv_sharing:
  enable: false
  base_depth: null
  num_recursion: null
  sharing: null

relaxation:
  enable: false
  skip_first_loop: false
  method: lora
  lora:
    r: 16
    alpha: 32
    dropout: 0.1
    target_modules:
    - q_proj
    - v_proj
    rank_pattern: null
    alpha_pattern: 2.0
    svd_init: false
  prompt:
    len: 16

mor:
  enable: true
  type: token
  capacity: null   # Auto-generated as "1.0,0.6667,0.3333" for num_recursion=3
  rand_router: false
  router_type: mlp
  z_loss: true
  z_coeff: 0.001
  temp: 1.0
  expert:
    cap_warmup_step: 0
    router_func: sigmoid
    alpha: 0.1
    sampling: aux_loss
    include_first: true
    coeff: 0.001
    gating: weighted
  token:
    router_func: softmax
    alpha: 1.0
    balancing: loss
    coeff: 0.1
    u: 0.001
    gating: weighted
    bal_warmup_step: 0

# === Training schedule ===
# Mirror the 19500-step CLEVR run: 100 epochs × ~195 steps/epoch.
lr_scheduler_type: warmup_stable_decay
lr_scheduler_kwargs:
  num_decay_steps: 4000   # 20% of training
  decay_type: linear
learning_rate: 0.003
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.1
precision: bf16
max_grad_norm: 1.0
num_train_steps: 19500
stop_steps: 19500
num_warmup_steps: 975    # 5% of training
save_interval: null       # Save 10× over the run
save_steps: 5000
fixed_save_steps: null
save_total_limit: null
logging_steps: 10
dataloader_num_workers: 16
gradient_checkpointing: false
deepspeed: ds_configs/stage2.config

# === Vision eval: per-patch recursion heatmap on COCO val ===
# Expects a pre-tokenized COCO val2017 split (5000 images) under
# data/coco_dataset/val/tok_rgb@256/. The COCO preparation pipeline was
# removed from the repo; regenerate this split externally if you intend to
# run this config (otherwise prefer the CLEVR-based configs).
vision_eval:
  enable: true
  eval_epoch_interval: 5
  num_val_samples: 2
  patch_grid_size: 16
  cosmos_model_path: pretrained_ckpts/Cosmos-0.1-Tokenizer-DI16x16