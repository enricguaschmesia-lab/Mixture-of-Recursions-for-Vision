[project]
name = "mor-visint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "accelerate>=1.13.0",
    "boto3>=1.42.92",
    "datasets>=4.8.4",
    "hydra-core>=1.3.2",
    "matplotlib>=3.7",
    "omegaconf>=2.3.0",
    "smart-open>=7.6.0",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers==4.52.4",
    "wandb>=0.26.0",
    "tensorboard>=2.14",
    "numpy>=1.24,<2.0",
    "pillow>=10.0",
    "huggingface_hub>=0.20,<1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
